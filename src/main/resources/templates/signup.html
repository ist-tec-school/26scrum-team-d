<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>新規登録 - タスク管理アプリケーション</title>
    <link th:href="@{/login.css}" rel="stylesheet">
    <link th:href="@{/signup.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script th:inline="javascript">
        const allSections = /*[[${sections}]]*/[];
    </script>
    <script th:src="@{/signup.js}" defer></script>
</head>
<body>
<div class="login-container">
    <h1>タスク管理アプリケーション</h1>

    <div class="task_form">
        <div class="form_header">
            <h2>新規ユーザー登録</h2>
        </div>

        <div class="form_body">
            <p th:if="${errorMessage}" class="error-text" th:text="${errorMessage}"></p>

        <form th:action="@{/signup}" method="post" autocomplete="off">
            <div class="form-group">
                <label for="name" class="required">名前</label>
                <input type="text" id="name" name="name" required placeholder="山田 太郎" />
                <p th:if="${nameError}" class="error-msg" th:text="${nameError}"></p>
            </div>
            <div class="form-group">
                <label for="department" class="required">部署</label>
                <select id="department" name="deptId" required onchange="handleDeptChange(this)">
                    <option value="">部署を選択してください</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.DEPT_ID}"
                            th:text="${dept.DEPT_NAME}"></option>
                    <option value="0">+ 部署を新規で登録</option>
                </select>
                <input type="text" id="newDepartmentName" name="newDepartmentName"
                       placeholder="新しい部署名を入力" style="display:none; margin-top:10px;" class="form-control" autocomplete="off">
                <input type="hidden" id="newDepartmentKana" name="newDepartmentKana">
                <div id="deptWarning" style="color: red; display: none; font-size: 0.8em;">
                    ※酷似した部署名が既に登録されています。
                </div>
            </div>

                <div class="form-group">
                    <label for="section" class="required">課</label>
                    <select id="section" name="sectionId" required disabled onchange="handleSectionChange(this)">
                        <option value="">先に部署を選択してください</option>
                    </select>
                    <p th:if="${sectionError}" class="error-msg" th:text="${sectionError}"></p>

                    <input type="text" id="newSectionName" name="newSectionName"
                           placeholder="新しい課名を入力" style="display:none; margin-top:10px;" class="form-control" autocomplete="off">
                </div>

            <div class="form-group">
                <label for="username" class="required">メールアドレス</label>
                <input type="email" id="username" name="username" required
                       pattern=".+@example\.com$"
                       title="メールアドレスが正しくありません。"
                       placeholder="example@example.com"
                       autocomplete="new-email"/>

                <p th:if="${emailError}" class="error-msg" th:text="${emailError}"></p>
            </div>

            <div class="form-group">
                <label for="password" class="required">パスワード</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required
                           minlength="8"
                           title="パスワードは8文字以上必要です"
                           placeholder="8文字以上で設定してください"
                           autocomplete="new-password"/>
                    <button type="button" id="togglePassword" class="btn-toggle">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>

                </div>
                <p th:if="${passwordError}" class="error-msg" th:text="${passwordError}"></p>
            </div>

                <input type="submit" value="アカウントを作成" class="btn-register" />
            </form>

            <div class="footer-links">
                <a th:href="@{/login}">← ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
