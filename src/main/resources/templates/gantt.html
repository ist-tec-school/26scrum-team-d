<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ガントチャート</title>
    <link rel="stylesheet" th:href="@{/gantt.css}">
</head>
<body>

<div class="container">
    <h1>ガントチャート</h1>

    <!-- コントロールパネル（タイムスケール切り替え、開始日表示選択 ＆ 5軸フィルター） -->
    <div class="control-panel">
        <div class="panel-row">
            <!-- タイムスケールの切り替え ＆ 開始日の表示選択 -->
            <div class="panel-cell">
                <label>タイムスケール表示切替:</label>
                <div class="btn-group">
                    <button class="btn">日</button>
                    <button class="btn active">週</button>
                    <button class="btn">月</button>
                </div>

                <label class="label-start-date">表示開始日:</label>
                <input type="date" value="2026-05-11" class="input-date">
            </div>

            <!-- プロジェクト・部署・課フィルター要件 -->
            <div class="panel-cell-right">
                <label>プロジェクト:</label>
                <select name="projectId" onchange="this.form.submit()">
                    <option value="all" th:selected="${selectedProject == 'all'}">すべてのプロジェクト</option>
                    <option th:each="project : ${projectList}"
                            th:value="${project.id}"
                            th:text="${project.name}"
                            th:selected="${selectedProject == project.id.toString()}">
                    </option>
                </select>

                <label>部署:</label>
                <select name="deptId" onchange="this.form.submit()">
                    <option value="all" th:selected="${selectedDept == 'all'}">すべての部署</option>
                    <option th:each="dept : ${deptList}"
                            th:value="${dept.DEPT_ID}"
                            th:text="${dept.DEPT_NAME}"
                            th:selected="${selectedDept == dept.DEPT_ID.toString()}">
                    </option>
                </select>

                <label>課:</label>
                <select name="sectionId" onchange="this.form.submit()">
                    <option value="all" th:selected="${selectedSection == 'all'}">すべての課</option>
                    <option th:each="sec : ${sectionList}"
                            th:value="${sec.SECTION_ID}"
                            th:text="${sec.SECTION_NAME}"
                            th:selected="${selectedSection == sec.SECTION_ID.toString()}">
                    </option>
                </select>
            </div>
        </div>

        <div class="panel-row panel-row-divider">
            <!-- 状態・担当者フィルター -->
            <div class="panel-cell">
                <label>状態:</label>
                <select>
                    <option value="">すべて</option>
                    <option value="未着手">未着手</option>
                    <option value="対応中">対応中</option>
                    <option value="完了">完了</option>
                </select>

                <label>担当者:</label>
                <select>
                    <option value="">すべて</option>
                    <option value="owner1">山田 太郎</option>
                    <option value="owner2">佐藤 美咲</option>
                    <option value="owner3">鈴木 一郎</option>
                </select>
                <button class="btn-primary">フィルター適用</button>
            </div>
        </div>
    </div>

    <!-- ガントチャート本体 -->
    <div class="gantt-wrapper">
        <table class="gantt-table">
            <thead>
            <tr>
                <th class="gantt-header-title sticky-col sticky-col-1">タスクのタイトル</th>
                <th class="gantt-header-user sticky-col sticky-col-2">担当者</th>
                <th class="gantt-header-date sticky-col sticky-col-3">開始日</th>
                <th class="gantt-header-date sticky-col sticky-col-4">終了日</th>
                <th class="gantt-header-status sticky-col sticky-col-5">状態</th>

                <th th:each="headerLabel : ${timeScaleHeaders}"
                    class="timeline-header"
                    th:text="${headerLabel}">
                    5/11
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${taskList}">
                <td th:text="${task.task}"></td>

                <td class="user-cell">
                    <th:block th:each="uid : ${task.taskUserIds}">
                        <div th:each="user : ${userList}" th:if="${user.USER_ID == uid}" th:text="${user.NAME}"></div>
                    </th:block>
                    <div th:if="${#lists.isEmpty(task.taskUserIds)}">-</div>
                </td>

                <td th:text="${task.startDate != null ? task.startDate : '-'}">2026/05/12</td>

                <td th:text="${task.deadline}">2026/05/15</td>

                <td th:switch="${task.done}">
                    <span th:case="0" class="status-badge status-notstart">未着手</span>
                    <span th:case="1" class="status-badge status-ing">対応中</span>
                    <span th:case="3" class="status-badge status-completed">完了</span>
                </td>

                <td class="chart-cell">
                    <div class="bar-actual"
                         th:classappend="${task.done == 0} ? 'notstart' : (${task.done == 1} ? 'ing' : 'completed')">
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
