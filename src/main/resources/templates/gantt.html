<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>ガントチャート</title>
    <link rel="stylesheet" th:href="@{/home.css}">
    <link rel="stylesheet" th:href="@{/gantt.css}">
    <script th:src="@{/gantt.js}" defer></script>
</head>
<body>

<div class="container">

    <h1>ガントチャート</h1>
    <a th:href="@{/list}" class="btn-base btn-white btn-back-top">タスク一覧に戻る</a>

    <!-- コントロールパネル（タイムスケール切り替え、開始日表示選択 ＆ 5軸フィルター） -->
    <form action="/gantt" method="get" id="mainFilterForm">
    <div class="list_header">
        <div class="time-scale">
            <label>タイムスケール表示切替:</label>
            <input type="hidden" name="timeScale" id="timeScaleInput" th:value="${selectedTimeScale != null ? selectedTimeScale : 'day'}">
            <div class="btn-group">
                <button type="button" class="btn" th:classappend="${selectedTimeScale == 'day' || selectedTimeScale == null} ? 'active' : ''" onclick="changeTimeScale('day')">日</button>
                <button type="button" class="btn" th:classappend="${selectedTimeScale == 'week'} ? 'active' : ''" onclick="changeTimeScale('week')">週</button>
                <button type="button" class="btn" th:classappend="${selectedTimeScale == 'month'} ? 'active' : ''" onclick="changeTimeScale('month')">月</button>
            </div>
            <label class="label-start-date">表示開始日:</label>
            <input type="date"
                   name="startDate"
                   th:value="${selectedStartDate != null ? selectedStartDate : today}"
                   class="input-date"
                   onchange="this.form.submit()">
        </div>

                <div class="list_header" id="task-list-top">

                    <div class="filter_area">
                        <div class="scope-toggle">
                            <a th:href="@{/gantt#task-list-top(scope='mine', status=${selectedStatus}, projectId=${selectedProject}, deptId=${selectedDept}, sectionId=${selectedSection}, keyword=${keyword})}"
                               class="scope-btn" th:classappend="${selectedScope == 'mine'} ? 'active' : ''">自分のタスク</a>
                            <a th:href="@{/gantt#task-list-top(scope='all', status=${selectedStatus}, projectId=${selectedProject}, deptId=${selectedDept}, sectionId=${selectedSection}, keyword=${keyword})}"
                               class="scope-btn" th:classappend="${selectedScope == 'all'} ? 'active' : ''">全てのタスク</a>
                        </div>
                        <input type="hidden" name="scope" th:value="${selectedScope}">

                        <select name="status" id="status-filter" onchange="this.form.submit()">
                            <option value="working_group" th:selected="${selectedStatus == 'working_group'}">未完了のタスク</option>
                            <option value="3" th:selected="${selectedStatus == '3'}">完了済みのタスク</option>
                            <option value="all" th:selected="${selectedStatus == 'all'}">すべてのタスク</option>
                        </select>
                    </div>
                </div>
            </div>

                <div class="filter_container">
                    <div class="filter_item">
                        <select name="deptId" onchange="this.form.submit()">
                            <option value="all" th:selected="${selectedDept == 'all'}">すべての部署</option>
                            <option th:each="dept : ${deptList}"
                                    th:value="${dept.DEPT_ID}"
                                    th:text="${dept.DEPT_NAME}"
                                    th:selected="${selectedDept == dept.DEPT_ID.toString()}">
                            </option>
                        </select>
                    </div>

                    <div class="filter_item">
                        <select name="sectionId" onchange="this.form.submit()">
                            <option value="all" th:selected="${selectedSection == 'all'}">すべての課</option>
                            <option th:each="sec : ${sectionList}"
                                    th:value="${sec.SECTION_ID}"
                                    th:text="${sec.SECTION_NAME}"
                                    th:data-dept="${sec.DEPT_ID}"
                                    th:selected="${selectedSection == sec.SECTION_ID.toString()}">
                            </option>
                        </select>
                    </div>

                    <div class="filter_item">
                        <select name="projectId" onchange="this.form.submit()">
                            <option value="all" th:selected="${selectedProject == 'all'}">すべてのプロジェクト</option>
                            <option th:each="project : ${projectList}"
                                    th:value="${project.id}"
                                    th:text="${project.name}"
                                    th:selected="${selectedProject == project.id.toString()}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="search_area">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="検索ワード タスクを検索できます。">
                    <button type="submit" class="btn-base btn-primary search-button">検索</button>

                    <a th:href="@{/gantt#task-list-top(scope='mine',
                    status='working_group',
                    projectId='all', deptId='all',
                    sectionId='all', keyword='')}"
                       class="btn-base btn-primary reset-button">
                        条件をリセット
                    </a>
                </div>

            </form>

    <!-- ガントチャート本体 -->
    <div class="gantt-wrapper">
        <table class="gantt-table">
            <thead>
            <tr>
                <th class="sticky-col sticky-col-1 col-title">タスクのタイトル</th>
                <th class="sticky-col sticky-col-2 col-owner">担当者</th>
                <th class="sticky-col sticky-col-3 col-sdate">開始日</th>
                <th class="sticky-col sticky-col-4 col-edate">終了日</th>
                <th class="sticky-col sticky-col-5 col-status">状態</th>

                <th:block th:each="headerLabel : ${timeScaleHeaders}">
                    <th class="timeline-header"
                        th:data-date="${headerLabel}"
                        th:text="${#strings.length(headerLabel) >= 10 ? #strings.replace(#strings.substring(headerLabel, 5, 10), '-', '/') : headerLabel}">
                        05/12
                    </th>
                </th:block>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="item : ${taskList}">
                <tr th:if="${item.isGroup}" class="row-group">
                    <td colspan="5" class="group-title-cell">
                        <span th:text="${item.displayTitle}">プロジェクト名</span>
                    <td th:colspan="${5 + #lists.size(timeScaleHeaders)}" class="group-empty-cell"></td>
                </tr>

                <tr th:unless="${item.isGroup}">
                    <td class="sticky-col sticky-col-1 col-title" th:text="${item.displayTitle}">タスク名</td>

                    <td class="sticky-col sticky-col-2 col-owner user-cell">
                        <th:block th:each="uid : ${item.task.taskUserIds}">
                            <div th:each="user : ${userList}" th:if="${user.USER_ID == uid}" th:text="${user.NAME}"></div>
                        </th:block>
                        <div th:if="${#lists.isEmpty(item.task.taskUserIds)}">-</div>
                    </td>

                    <td class="sticky-col sticky-col-3 col-sdate" th:text="${item.task.start_date}">開始日</td>
                    <td class="sticky-col sticky-col-4 col-edate" th:text="${item.task.deadline}">終了日</td>
                    <td class="sticky-col sticky-col-5 col-status" th:switch="${item.task.done}">
                        <span th:case="0" class="status-badge status-notstart">未着手</span>
                        <span th:case="1" class="status-badge status-ing">対応中</span>
                        <span th:case="3" class="status-badge status-completed">完了</span>
                    </td>

                    <th:block th:each="headerLabel : ${timeScaleHeaders}">
                        <th:block th:with="
                            isInPeriod=${item.task.start_date != null && item.task.deadline != null && headerLabel >= #strings.substring(item.task.start_date, 0, #strings.length(headerLabel)) && headerLabel <= #strings.substring(item.task.deadline, 0, #strings.length(headerLabel))},
                            isDeadlineDay=${#strings.startsWith(item.task.deadline, headerLabel)}">

                            <td class="chart-cell" th:data-date="${headerLabel}">
                                <div th:if="${isInPeriod}"
                                     class="bar-actual"
                                     th:classappend="${item.task.done == 0} ? 'bar-todo' : (${item.task.done == 1} ? 'bar-working' : 'bar-done')">
                                </div>

                                <span th:if="${isInPeriod && isDeadlineDay}"
                                      class="chart-status-text"
                                      th:switch="${item.task.done}">
                                    <th:block th:case="0">未着手</th:block>
                                    <th:block th:case="1">対応中</th:block>
                                    <th:block th:case="3">完了</th:block>
                                </span>
                            </td>
                        </th:block>
                    </th:block>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
</div>


</body>
</html>
