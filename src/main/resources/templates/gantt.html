<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ガントチャート</title>
    <link rel="stylesheet" th:href="@{/gantt.css}">
</head>
<body>

<div class="container">
    <a th:href="@{/list}" class="btn-base btn-white btn-back-top">戻る</a>

    <h1>ガントチャート</h1>

    <!-- コントロールパネル（タイムスケール切り替え、開始日表示選択 ＆ 5軸フィルター） -->
    <form action="/list#task-list-top" method="get" id="mainFilterForm">
        <input type="hidden" name="scope" th:value="${selectedScope}">
        <input type="hidden" name="keyword" th:value="${keyword}">

    <div class="control-panel">
        <div class="panel-row">
            <div class="panel-cell">
                <label>タイムスケール表示切替:</label>
                <div class="btn-group">
                    <button type="button" class="btn active">日</button>
                    <button type="button" class="btn">週</button>
                    <button type="button" class="btn">月</button>
                </div>

                <label class="label-start-date">表示開始日:</label>
                <input type="date"
                       name="startDate"
                       th:value="${selectedStartDate != null ? selectedStartDate : today}"
                       class="input-date"
                       onchange="this.form.submit()">
            </div>

            <!-- プロジェクト・部署・課フィルター要件 -->
            <div class="panel-cell-right">
                <label>プロジェクト:</label>
                <select name="projectId" onchange="this.form.submit()">
                    <option value="all" th:selected="${selectedProject == 'all'}">すべてのプロジェクト</option>
                    <option th:each="project : ${projectList}"
                            th:value="${project.id}"
                            th:text="${project.name}"
                            th:selected="${selectedProject == project.id.toString()}">
                    </option>
                </select>

                <label>部署:</label>
                <select name="deptId" onchange="this.form.submit()">
                    <option value="all" th:selected="${selectedDept == 'all'}">すべての部署</option>
                    <option th:each="dept : ${deptList}"
                            th:value="${dept.DEPT_ID}"
                            th:text="${dept.DEPT_NAME}"
                            th:selected="${selectedDept == dept.DEPT_ID.toString()}">
                    </option>
                </select>

                <label>課:</label>
                <select name="sectionId" onchange="this.form.submit()">
                    <option value="all" th:selected="${selectedSection == 'all'}">すべての課</option>
                    <option th:each="sec : ${sectionList}"
                            th:value="${sec.SECTION_ID}"
                            th:text="${sec.SECTION_NAME}"
                            th:selected="${selectedSection == sec.SECTION_ID.toString()}">
                    </option>
                </select>
            </div>
        </div>

        <div class="panel-row panel-row-divider">
            <!-- 状態・担当者フィルター -->
            <div class="panel-cell">
                <label>状態:</label>
                <select name="status" id="status-filter" onchange="this.form.submit()">
                    <option value="working_group" th:selected="${selectedStatus == 'working_group'}">未完了のタスク</option>
                    <option value="3" th:selected="${selectedStatus == '3'}">完了済みのタスク</option>
                    <option value="all" th:selected="${selectedStatus == 'all'}">すべてのタスク</option>
                </select>

                <label>担当者:</label>
                <select name="taskUserId" onchange="this.form.submit()">
                    <option value="all" th:selected="${selectedTaskUserId == 'all'}">すべて</option>
                    <option th:each="user : ${userList}"
                            th:value="${user.USER_ID}"
                            th:text="${user.NAME}"
                            th:selected="${selectedTaskUserId == user.USER_ID.toString()}">
                    </option>
                </select>
            </div>
        </div>
    </div>

    <!-- ガントチャート本体 -->
    <div class="gantt-wrapper">
        <table class="gantt-table">
            <thead>
            <tr>
                <th class="sticky-col sticky-col-1 col-title">タスクのタイトル</th>
                <th class="sticky-col sticky-col-2 col-owner">担当者</th>
                <th class="sticky-col sticky-col-3 col-sdate">開始日</th>
                <th class="sticky-col sticky-col-4 col-edate">終了日</th>
                <th class="sticky-col sticky-col-5 col-status">状態</th>

                <th th:each="headerLabel : ${timeScaleHeaders}"
                    class="timeline-header"
                    th:text="${headerLabel}">
                    5/11
                </th>
            </tr>
            </thead>
                <tbody>
                <tr th:each="task : ${taskList}">
                    <td class="sticky-col sticky-col-1 col-title" th:text="${task.task}">タスク名</td>

                    <td class="sticky-col sticky-col-2 col-owner user-cell">
                        <th:block th:each="uid : ${task.taskUserIds}">
                            <div th:each="user : ${userList}" th:if="${user.USER_ID == uid}" th:text="${user.NAME}"></div>
                        </th:block>
                        <div th:if="${#lists.isEmpty(task.taskUserIds)}">-</div>
                    </td>

                    <td class="sticky-col sticky-col-3 col-sdate" th:text="${task.start_date != null ? task.start_date : '-'}">2026-05-12</td>
                    <td class="sticky-col sticky-col-4 col-edate" th:text="${task.deadline}">2026-05-15</td>
                    <td class="sticky-col sticky-col-5 col-status" th:switch="${task.done}">
                        <span th:case="0" class="status-badge status-notstart">未着手</span>
                        <span th:case="1" class="status-badge status-ing">対応中</span>
                        <span th:case="3" class="status-badge status-completed">完了</span>
                    </td>

                    <th:block th:each="headerLabel : ${timeScaleHeaders}">
                        <th:block th:with="
                    isInPeriod=${task.start_date != null && task.deadline != null && headerLabel >= task.start_date && headerLabel <= task.deadline},
                    isDeadlineDay=${headerLabel == task.deadline}">

                            <td class="chart-cell" th:classappend="${#strings.contains(headerLabel, 'Sat') || #strings.contains(headerLabel, 'Sun')} ? 'weekend'">

                                <div th:if="${isInPeriod}"
                                     class="bar-actual"
                                     th:classappend="${task.done == 0} ? 'bar-todo' : (${task.done == 1} ? 'bar-working' : 'bar-done')">
                                </div>

                                <span th:if="${isInPeriod && isDeadlineDay}"
                                      class="chart-status-text"
                                      th:switch="${task.done}">
                                    <th:block th:case="0">未着手</th:block>
                                    <th:block th:case="1">対応中</th:block>
                                    <th:block th:case="3">完了</th:block>
                                </span>

                            </td>
                        </th:block>
                    </th:block>
                </tr>
                </tbody>
        </table>
    </div>
    </form>
</div>


</body>
</html>
