<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ガントチャート</title>
    <link rel="stylesheet" th:href="@{/gantt.css}">
</head>
<body>

<div class="container">
    <h1>ガントチャート</h1>

    <!-- コントロールパネル（タイムスケール切り替え、開始日表示選択 ＆ 5軸フィルター） -->
    <div class="control-panel">
        <div class="panel-row">
            <!-- タイムスケールの切り替え ＆ 開始日の表示選択 -->
            <div class="panel-cell">
                <label>タイムスケール表示切替:</label>
                <div class="btn-group">
                    <button class="btn">日</button>
                    <button class="btn active">週</button>
                    <button class="btn">月</button>
                </div>

                <label class="label-start-date">表示開始日:</label>
                <input type="date" value="2026-05-11" class="input-date">
            </div>

            <!-- プロジェクト・部署・課フィルター要件 -->
            <div class="panel-cell-right">
                <label>プロジェクト:</label>
                <select>
                    <option value="">すべて</option>
                    <option value="p1" selected>次世代システム開発基盤PJ</option>
                    <option value="p2">基幹リプレイスPJ</option>
                </select>

                <label>部署:</label>
                <select>
                    <option value="">すべて</option>
                    <option value="d1" selected>開発本部</option>
                    <option value="d2">企画・マーケティング部</option>
                </select>

                <label>課:</label>
                <select>
                    <option value="">すべて</option>
                    <option value="s1">開発1課</option>
                    <option value="s2">デザイン課</option>
                </select>
            </div>
        </div>

        <div class="panel-row panel-row-divider">
            <!-- 状態フィルター ＆ 担当者フィルター -->
            <div class="panel-cell">
                <label>状態:</label>
                <select>
                    <option value="">すべて</option>
                    <option value="未着手">未着手</option>
                    <option value="対応中">対応中</option>
                    <option value="完了">完了</option>
                </select>

                <label>担当者:</label>
                <select>
                    <option value="">すべて</option>
                    <option value="owner1">山田 太郎</option>
                    <option value="owner2">佐藤 美咲</option>
                    <option value="owner3">鈴木 一郎</option>
                </select>
                <button class="btn-primary">フィルター適用</button>
            </div>
        </div>
    </div>

    <!-- ガントチャート本体 -->
    <div class="gantt-wrapper">
        <table class="gantt-table">
            <thead>
            <tr>
                <th style="width: 320px;">タスクのタイトル</th>
                <th style="width: 120px;">担当者</th>
                <th style="width: 110px;">開始日</th>
                <th style="width: 110px;">終了日</th>
                <th style="width: 100px;">状態</th>
                <!-- タイムラインヘッダー（日付直マッピング・連続） -->
                <th class="timeline-header">5/11</th>
                <th class="timeline-header">5/12</th>
                <th class="timeline-header">5/13</th>
                <th class="timeline-header">5/14</th>
                <th class="timeline-header">5/15</th>
                <th class="timeline-header sat-header">5/16</th>
                <th class="timeline-header sun-header">5/17</th>
                <th class="timeline-header">5/18</th>
                <th class="timeline-header">5/19</th>
                <th class="timeline-header">5/20</th>
                <th class="timeline-header">5/21</th>
                <th class="timeline-header">5/22</th>
                <th class="timeline-header sat-header">5/23</th>
                <th class="timeline-header sun-header">5/24</th>
                <th class="timeline-header">5/25</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${taskList}">
                <td th:text="${task.task}">タスク名</td>

                <td>
                    <span th:text="${task.projectName}">担当者</span>
                </td>

                <td th:text="${task.start_date}">2026/05/11</td>

                <td th:text="${task.deadline}">2026/05/15</td>

                <td class="progress-cell">
                    <span th:if="${task.done == 0}" class="status-badge status-notstart">未着手</span>
                    <span th:if="${task.done == 1}" class="status-badge status-ing">対応中</span>
                    <span th:if="${task.done == 2}" class="status-badge status-completed">完了</span>
                </td>

                <th:block th:remove="all">
                </th:block>

                <td class="chart-cell"
                    th:data-start="${task.start_date}"
                    th:data-end="${task.deadline}"
                    th:data-status="${task.done}">

                    <div th:class="'bar-actual ' + (${task.done == 0} ? 'notstart' : (${task.done == 1} ? 'ing' : 'completed'))"></div>

                    <span class="chart-status-text"
                          th:text="${task.done == 0} ? '未着手' : (${task.done == 1} ? '対応中' : '完了')">
                  状態テキスト
            </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
